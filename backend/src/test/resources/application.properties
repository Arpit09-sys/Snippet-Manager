# Test Database Configuration - Uses separate snippetdb_test database
spring.application.name=snippet-manager-test

spring.datasource.url=jdbc:mysql://localhost:3306/snippetdb_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
