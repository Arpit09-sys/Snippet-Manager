# Application Name & Port
spring.application.name=snippet-manager
server.port=8080

# MySQL Database Configuration
# Uses environment variables if provided, otherwise defaults to local root with empty password
spring.datasource.url=jdbc:mysql://localhost:3306/snippetdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA / Hibernate Configuration
# Automatically creates or updates tables in snippetdb based on Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
